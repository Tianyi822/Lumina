appId: com.lumina.app
productName: Lumina
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/node_modules/**/*.map'
  - '!node_modules/cpu-features/build/Release/*.node'
  - '!node_modules/ssh2/lib/protocol/crypto/build/Release/*.node'
afterPack: scripts/build/prunePlatformArtifacts.cjs
win:
  icon: icon.ico
  target:
    - nsis
  executableName: Lumina
  # 当前以个人开源项目形式发布，未配置 Windows 代码签名证书。
  # 不启用 forceCodeSigning，避免无证书时阻断 Windows 测试构建。
  # 未来可在 CI 中通过 CSC_LINK/CSC_KEY_PASSWORD 或 WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD 自动签名。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  include: build/installer.nsh
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  displayLanguageSelector: false
mac:
  icon: icon.icns
  target:
    - dmg
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Tianyi822
  repo: Lumina
