name: Build Installers

'on':
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Use official Electron mirrors in CI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const mirrorKeys = new Set([
            'electron_mirror',
            'electron-builder-binaries-mirror',
            'electron_builder_binaries_mirror',
          ])

          const shouldRemoveLine = (line) => {
            const trimmed = line.trimStart()

            if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith(';')) {
              return false
            }

            const match = /^([^=\s:]+)\s*(?:=|:|\s)/.exec(trimmed)
            return Boolean(match && mirrorKeys.has(match[1]))
          }

          for (const fileName of ['.npmrc', '.yarnrc']) {
            const filePath = path.join(process.cwd(), fileName)

            if (!fs.existsSync(filePath)) {
              continue
            }

            const original = fs.readFileSync(filePath, 'utf8')
            const next = original
              .split(/\r?\n/)
              .filter((line) => !shouldRemoveLine(line))
              .join('\n')

            if (next !== original) {
              fs.writeFileSync(filePath, next, 'utf8')
            }
          }
          NODE

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Build Windows installer
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_SYMLINKS: 'true'
        run: |
          yarn electron-builder --win --publish never

      - name: Mark Windows artifact as unsigned
        shell: pwsh
        run: |
          "### Windows installer" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "The Windows installer produced by this workflow is currently unsigned because this personal open-source project does not provide a code signing certificate yet." >> $env:GITHUB_STEP_SUMMARY
          "Users may see Microsoft Defender SmartScreen or Edge download protection warnings such as `Publisher: Unknown`." >> $env:GITHUB_STEP_SUMMARY
          "Future signed releases can use `WIN_CSC_LINK` and `WIN_CSC_KEY_PASSWORD` GitHub Secrets." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-windows-unsigned
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  macos:
    name: macOS installer
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Use official Electron mirrors in CI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const mirrorKeys = new Set([
            'electron_mirror',
            'electron-builder-binaries-mirror',
            'electron_builder_binaries_mirror',
          ])

          const shouldRemoveLine = (line) => {
            const trimmed = line.trimStart()

            if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith(';')) {
              return false
            }

            const match = /^([^=\s:]+)\s*(?:=|:|\s)/.exec(trimmed)
            return Boolean(match && mirrorKeys.has(match[1]))
          }

          for (const fileName of ['.npmrc', '.yarnrc']) {
            const filePath = path.join(process.cwd(), fileName)

            if (!fs.existsSync(filePath)) {
              continue
            }

            const original = fs.readFileSync(filePath, 'utf8')
            const next = original
              .split(/\r?\n/)
              .filter((line) => !shouldRemoveLine(line))
              .join('\n')

            if (next !== original) {
              fs.writeFileSync(filePath, next, 'utf8')
            }
          }
          NODE

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Build macOS installer
        shell: bash
        run: |
          yarn electron-builder --mac --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-macos
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
