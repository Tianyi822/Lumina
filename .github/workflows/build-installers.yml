name: Build Installers

'on':
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Build Windows installer
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_SYMLINKS: 'true'
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          NPM_CONFIG_ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: |
          yarn electron-builder --win --publish never

      - name: Mark Windows artifact as unsigned
        shell: pwsh
        run: |
          "### Windows installer" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "The Windows installer produced by this workflow is currently unsigned because this personal open-source project does not provide a code signing certificate yet." >> $env:GITHUB_STEP_SUMMARY
          "Users may see Microsoft Defender SmartScreen or Edge download protection warnings such as `Publisher: Unknown`." >> $env:GITHUB_STEP_SUMMARY
          "Future signed releases can use `WIN_CSC_LINK` and `WIN_CSC_KEY_PASSWORD` GitHub Secrets." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-windows-unsigned
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  macos:
    name: macOS installer
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Clear Electron mirror config
        shell: bash
        run: |
          npm config delete electron_mirror || true
          npm config delete electron-builder-binaries-mirror || true
          npm config delete electron_builder_binaries_mirror || true
          yarn config delete electron_mirror || true
          yarn config delete electron-builder-binaries-mirror || true
          yarn config delete electron_builder_binaries_mirror || true

      - name: Build macOS installer
        shell: bash
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          NPM_CONFIG_ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: |
          yarn electron-builder --mac --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-macos
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
