name: Build Installers

'on':
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Prepare official Electron downloads
        shell: bash
        run: |
          node <<'NODE'
          const https = require('https')
          const fs = require('fs')
          const path = require('path')

          const electronAssetUrl = (version, file) =>
            `https://github.com/electron/electron/releases/download/v${version}/${file}`
          const builderAssetUrl = (release, file) =>
            `https://github.com/electron-userland/electron-builder-binaries/releases/download/${release}/${file}`
          const mirrorKeys = new Set([
            'electron_mirror',
            'electron-builder-binaries-mirror',
            'electron_builder_binaries_mirror',
          ])

          const shouldRemoveLine = (line) => {
            const trimmed = line.trimStart()

            if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith(';')) {
              return false
            }

            const match = /^([^=\s:]+)\s*(?:=|:|\s)/.exec(trimmed)
            return Boolean(match && mirrorKeys.has(match[1]))
          }

          for (const fileName of ['.npmrc', '.yarnrc']) {
            const filePath = path.join(process.cwd(), fileName)

            if (!fs.existsSync(filePath)) {
              continue
            }

            const original = fs.readFileSync(filePath, 'utf8')
            const next = original
              .split(/\r?\n/)
              .filter((line) => !shouldRemoveLine(line))
              .join('\n')

            if (next !== original) {
              fs.writeFileSync(filePath, next, 'utf8')
            }
          }

          const lockfile = fs.readFileSync('yarn.lock', 'utf8')
          const electronVersion = lockfile.match(/^electron@\^?[\d.]+:\r?\n\s+version "([^"]+)"/m)?.[1]

          if (!electronVersion) {
            throw new Error('Cannot resolve locked Electron version from yarn.lock')
          }

          const requestHead = (url) =>
            new Promise((resolve, reject) => {
              const req = https.request(url, { method: 'HEAD' }, (res) => {
                const status = res.statusCode || 0

                if ([301, 302, 303, 307, 308].includes(status)) {
                  resolve({ url, status })
                  return
                }

                if (status >= 200 && status < 300) {
                  resolve({ url, status })
                  return
                }

                reject(new Error(`Unexpected status ${status} for ${url}`))
              })

              req.on('error', reject)
              req.setTimeout(15000, () => req.destroy(new Error(`Timed out checking ${url}`)))
              req.end()
            })

          const checks = [
            electronAssetUrl(
              electronVersion,
              `electron-v${electronVersion}-${process.platform}-${process.arch}.zip`
            ),
            builderAssetUrl('nsis-3.0.4.1', 'nsis-3.0.4.1.7z'),
            builderAssetUrl('nsis-resources-3.4.1', 'nsis-resources-3.4.1.7z'),
          ]

          Promise.all(checks.map((url) => requestHead(url)))
            .then((results) => {
              for (const result of results) {
                console.log(`Verified ${result.status}: ${result.url}`)
              }
            })
            .catch((error) => {
              console.error(error)
              process.exit(1)
            })
          NODE

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Build Windows installer
        shell: pwsh
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_SYMLINKS: 'true'
        run: |
          Remove-Item Env:ELECTRON_MIRROR -ErrorAction SilentlyContinue
          Remove-Item Env:NPM_CONFIG_ELECTRON_MIRROR -ErrorAction SilentlyContinue
          Remove-Item Env:npm_config_electron_mirror -ErrorAction SilentlyContinue
          Remove-Item Env:ELECTRON_BUILDER_BINARIES_MIRROR -ErrorAction SilentlyContinue
          Remove-Item Env:NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR -ErrorAction SilentlyContinue
          Remove-Item Env:npm_config_electron_builder_binaries_mirror -ErrorAction SilentlyContinue
          yarn electron-builder --win --publish never

      - name: Mark Windows artifact as unsigned
        shell: pwsh
        run: |
          "### Windows installer" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "The Windows installer produced by this workflow is currently unsigned because this personal open-source project does not provide a code signing certificate yet." >> $env:GITHUB_STEP_SUMMARY
          "Users may see Microsoft Defender SmartScreen or Edge download protection warnings such as `Publisher: Unknown`." >> $env:GITHUB_STEP_SUMMARY
          "Future signed releases can use `WIN_CSC_LINK` and `WIN_CSC_KEY_PASSWORD` GitHub Secrets." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: lumina-windows-x64-setup
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  macos:
    name: macOS installer
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Prepare official Electron downloads
        shell: bash
        run: |
          node <<'NODE'
          const https = require('https')
          const fs = require('fs')
          const path = require('path')

          const electronAssetUrl = (version, file) =>
            `https://github.com/electron/electron/releases/download/v${version}/${file}`
          const builderAssetUrl = (release, file) =>
            `https://github.com/electron-userland/electron-builder-binaries/releases/download/${release}/${file}`
          const mirrorKeys = new Set([
            'electron_mirror',
            'electron-builder-binaries-mirror',
            'electron_builder_binaries_mirror',
          ])

          const shouldRemoveLine = (line) => {
            const trimmed = line.trimStart()

            if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith(';')) {
              return false
            }

            const match = /^([^=\s:]+)\s*(?:=|:|\s)/.exec(trimmed)
            return Boolean(match && mirrorKeys.has(match[1]))
          }

          for (const fileName of ['.npmrc', '.yarnrc']) {
            const filePath = path.join(process.cwd(), fileName)

            if (!fs.existsSync(filePath)) {
              continue
            }

            const original = fs.readFileSync(filePath, 'utf8')
            const next = original
              .split(/\r?\n/)
              .filter((line) => !shouldRemoveLine(line))
              .join('\n')

            if (next !== original) {
              fs.writeFileSync(filePath, next, 'utf8')
            }
          }

          const lockfile = fs.readFileSync('yarn.lock', 'utf8')
          const electronVersion = lockfile.match(/^electron@\^?[\d.]+:\r?\n\s+version "([^"]+)"/m)?.[1]

          if (!electronVersion) {
            throw new Error('Cannot resolve locked Electron version from yarn.lock')
          }

          const requestHead = (url) =>
            new Promise((resolve, reject) => {
              const req = https.request(url, { method: 'HEAD' }, (res) => {
                const status = res.statusCode || 0

                if ([301, 302, 303, 307, 308].includes(status)) {
                  resolve({ url, status })
                  return
                }

                if (status >= 200 && status < 300) {
                  resolve({ url, status })
                  return
                }

                reject(new Error(`Unexpected status ${status} for ${url}`))
              })

              req.on('error', reject)
              req.setTimeout(15000, () => req.destroy(new Error(`Timed out checking ${url}`)))
              req.end()
            })

          const dmgArch = process.arch === 'arm64' ? 'arm64' : 'x86_64'
          const checks = [
            electronAssetUrl(
              electronVersion,
              `electron-v${electronVersion}-${process.platform}-${process.arch}.zip`
            ),
            builderAssetUrl(
              'dmg-builder@1.2.0',
              `dmgbuild-bundle-${dmgArch}-75c8a6c.tar.gz`
            ),
          ]

          Promise.all(checks.map((url) => requestHead(url)))
            .then((results) => {
              for (const result of results) {
                console.log(`Verified ${result.status}: ${result.url}`)
              }
            })
            .catch((error) => {
              console.error(error)
              process.exit(1)
            })
          NODE

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Build macOS installer
        shell: bash
        run: |
          unset ELECTRON_MIRROR NPM_CONFIG_ELECTRON_MIRROR npm_config_electron_mirror
          unset ELECTRON_BUILDER_BINARIES_MIRROR
          unset NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR
          unset npm_config_electron_builder_binaries_mirror
          yarn electron-builder --mac --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: lumina-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          cp artifacts/lumina-windows-x64-setup/* release-assets/
          cp artifacts/lumina-macos/* release-assets/
          cp release-assets/latest.yml release-assets/latest-win.yml

      - name: Validate release assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const dir = path.join(process.cwd(), 'release-assets')
          const entries = fs.readdirSync(dir)
          const errors = []

          const exists = (name) => fs.existsSync(path.join(dir, name))
          const requireFile = (name) => {
            if (!exists(name)) {
              errors.push(`Missing ${name}`)
            }
          }
          const requireMatch = (pattern, label) => {
            if (!entries.some((name) => pattern.test(name))) {
              errors.push(`Missing ${label}`)
            }
          }
          const readFile = (name) => fs.readFileSync(path.join(dir, name), 'utf8')
          const collectRefs = (name) => {
            const content = readFile(name)
            return [...content.matchAll(/^\s*(?:url|path):\s*['"]?([^'"\r\n#]+)['"]?\s*$/gm)]
              .map((match) => match[1].trim())
              .filter((value) => value && !/^https?:\/\//i.test(value))
          }
          const validateRefs = (name, platformPattern) => {
            for (const ref of collectRefs(name)) {
              if (!exists(ref)) {
                errors.push(`${name} references missing asset ${ref}`)
              }
              if (!platformPattern.test(ref)) {
                errors.push(`${name} references unexpected platform asset ${ref}`)
              }
            }
          }

          requireFile('latest.yml')
          requireFile('latest-win.yml')
          requireFile('latest-mac.yml')
          requireMatch(/\.exe$/i, 'Windows installer')
          requireMatch(/\.exe\.blockmap$/i, 'Windows blockmap')
          requireMatch(/\.dmg$/i, 'macOS DMG')
          requireMatch(/\.dmg\.blockmap$/i, 'macOS DMG blockmap')

          if (exists('latest.yml') && exists('latest-win.yml')) {
            const latest = readFile('latest.yml')
            const latestWin = readFile('latest-win.yml')
            if (latest !== latestWin) {
              errors.push('latest.yml and latest-win.yml must be identical')
            }
          }

          if (exists('latest.yml')) {
            validateRefs('latest.yml', /\.(exe|exe\.blockmap)$/i)
          }
          if (exists('latest-win.yml')) {
            validateRefs('latest-win.yml', /\.(exe|exe\.blockmap)$/i)
          }
          if (exists('latest-mac.yml')) {
            validateRefs('latest-mac.yml', /\.(dmg|zip|dmg\.blockmap|zip\.blockmap)$/i)
          }

          if (errors.length > 0) {
            for (const error of errors) {
              console.error(error)
            }
            process.exit(1)
          }

          console.log(`Validated release assets: ${entries.join(', ')}`)
          NODE

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
